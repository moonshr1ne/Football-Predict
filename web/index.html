<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101b35">
    <title>Barça Match Lab</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <header class="app-header">
      <div class="header-inner">
        <div class="brand">
          <img src="https://a.espncdn.com/i/teamlogos/soccer/500/83.png" alt="FC Barcelona" width="76" height="76">
          <div>
            <p class="kicker">LA LIGA + UEFA CHAMPIONS LEAGUE</p>
            <h1>BARÇA MATCH LAB</h1>
          </div>
        </div>
        <div class="system-state"><span class="live-dot"></span><span id="system-label">Автообновление активно</span></div>
      </div>
    </header>

    <main>
      <section class="search-band">
        <div class="content-width search-layout">
          <form id="predict-form" class="search-form">
            <label for="opponent">Соперник Барселоны</label>
            <div class="search-row">
              <input id="opponent" name="opponent" value="Реал Мадрид" list="opponents" autocomplete="off" spellcheck="false">
              <datalist id="opponents"></datalist>
              <button type="submit">Рассчитать</button>
            </div>
          </form>
          <button id="auto-check" class="icon-button" type="button" title="Обновить результаты и модель" aria-label="Обновить результаты и модель">↻</button>
        </div>
      </section>

      <section id="loading" class="content-width loading" hidden>
        <span class="loader"></span>
        <span>Собираю протоколы и пересчитываю модель…</span>
      </section>
      <section id="error" class="content-width error-banner" hidden></section>
      <section id="prediction" aria-live="polite"></section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
